[settings]
experimental = true
lockfile = true
pin = true

[tools]
"aqua:jdx/usage" = "3.3.0"
"aqua:jdx/hk" = "1.45.0"
"aqua:apple/pkl" = "0.31.0"
"aqua:dprint/dprint" = "0.53.2"
"core:rust" = { version = "1.95.0", profile = "minimal", components = "rustfmt,clippy" }
"core:swift" = { version = "6.3.1", os = ["macos"] }
swiftformat = "0.61.1"

[hooks]
postinstall = ["hk install --mise --quiet", "cargo fetch"]

[tasks.build]
run = '''
cargo build
{% if os() == "macos" %}
mise run macos-build
{% endif %}
'''

[tasks.test]
run = '''
cargo test
{% if os() == "macos" %}
mise run macos-test
{% endif %}
'''

[tasks.check]
run = "hk check --all"

[tasks.fix]
run = "hk fix --all"

[tasks.run]
run = '''
{% if os() == "macos" %}
mise run macos-run
{% elif os() == "linux" %}
mise run linux-run
{% else %}
echo "BrainDrain does not have a desktop app task for {{ os() }}; use 'mise run cli -- <command>'."
exit 1
{% endif %}
'''

[tasks.cli]
run = "cargo run -p braindrain-cli --"

[tasks.daemon]
run = "cargo run -p braindrain-cli -- daemon run"

[tasks.web]
run = "cargo run -p braindrain-web"

[tasks.linux-build]
run = "cargo build -p braindrain-gui"

[tasks.linux-run]
run = "cargo run -p braindrain-gui"

[tasks.plasma-run]
run = 'plasmoidviewer -a apps/plasma/package -l topedge -f horizontal'

[tasks.ffi-swift]
run = [
  "rm -rf crates/bindings-uniffi/.generated",
  "mkdir -p crates/bindings-uniffi/.generated/swift",
  "cargo build -p braindrain-bindings-uniffi",
  "cargo run -p braindrain-uniffi-bindgen -- generate --library target/debug/libbraindrain_bindings_uniffi.dylib --language swift --out-dir crates/bindings-uniffi/.generated/swift",
]

[tasks.macos-build]
depends = ["ffi-swift"]
run = "CLANG_MODULE_CACHE_PATH=build/macos/debug/clang-module-cache swift build --package-path apps/macos --scratch-path build/macos/debug/swiftpm --cache-path build/macos/debug/swiftpm-cache --config-path build/macos/debug/swiftpm-config --security-path build/macos/debug/swiftpm-security --disable-sandbox"

[tasks.macos-test]
depends = ["ffi-swift"]
run = "CLANG_MODULE_CACHE_PATH=build/macos/debug/clang-module-cache swift test --package-path apps/macos --scratch-path build/macos/debug/swiftpm --cache-path build/macos/debug/swiftpm-cache --config-path build/macos/debug/swiftpm-config --security-path build/macos/debug/swiftpm-security --disable-sandbox"

[tasks.macos-run]
depends = ["ffi-swift"]
run = "CLANG_MODULE_CACHE_PATH=build/macos/debug/clang-module-cache swift run --package-path apps/macos --scratch-path build/macos/debug/swiftpm --cache-path build/macos/debug/swiftpm-cache --config-path build/macos/debug/swiftpm-config --security-path build/macos/debug/swiftpm-security --disable-sandbox BrainDrain"

[tasks.macos-package]
description = "Build apps/macos into an unsigned release zip"
run = "scripts/package-macos.sh package"

[tasks.macos-release]
description = "Build, Developer ID sign, notarize, staple, and zip apps/macos"
run = "scripts/package-macos.sh release"
